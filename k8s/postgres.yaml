apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi # Adjust as needed
        #  storageClassName: "openebs-hostpath"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signage-postgres
spec:
  selector:
    matchLabels:
      app: signage-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: signage-postgres
    spec:
      containers:
      - name: postgres
        image: harbor.cu.ac.kr/postgresql/postgresql-16.3-huge-pages:latest
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "signage"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: signage-postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: signage-postgres
  clusterIP: None # Headless service if stable network ID needed, or remove for ClusterIP
